<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="50%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Decorative Ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="12 8"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.8"/>
  
  <!-- Golden Tibetan Letter ཀ (Ka) -->
  <g filter="url(#shadow)">
    <!-- Tibetan 'Ka' (Uchen) stylized geometry -->
    <path d="M 160 170 L 352 170" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round"/>
    <path d="M 235 170 L 235 345 C 235 365 250 375 275 375 C 295 375 310 365 315 345 L 315 240" fill="none" stroke="url(#goldGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 185 240 L 315 240" stroke="url(#goldGrad)" stroke-width="22" stroke-linecap="round"/>
    <!-- Central jewel / bindu -->
    <circle cx="256" cy="115" r="16" fill="url(#goldGrad)"/>
    <path d="M 256 90 C 265 105 265 110 256 122 C 247 110 247 105 256 90 Z" fill="#fef08a"/>
  </g>
  
  <!-- Small subtext or lotus base -->
  <path d="M 216 410 Q 256 390 296 410 Q 256 425 216 410 Z" fill="url(#goldGrad)" opacity="0.9"/>
  <circle cx="256" cy="415" r="4" fill="#fef08a"/>
</svg>
